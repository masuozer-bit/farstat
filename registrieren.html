<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrieren — Studiumm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand"><span class="brand-mark">σ</span><span class="brand-name">Studiumm</span></a>
      <nav class="nav">
        <a href="module.html">Module</a>
        <a href="ueber.html">Über</a>
        <a href="preise.html">Preise</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="anmelden.html" class="nav-cta">Anmelden</a>
      </nav>
      <button class="nav-toggle" aria-label="Menü" aria-expanded="false" aria-controls="mobile-nav"><span></span><span></span><span></span></button>
    </div>
    <nav class="mobile-nav" id="mobile-nav">
      <a href="module.html">Module</a>
      <a href="ueber.html">Über</a>
      <a href="preise.html">Preise</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="anmelden.html">Anmelden</a>
    </nav>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <span class="eyebrow">Konto erstellen</span>
      <h1>Registrieren</h1>
      <p class="auth-sub">Erstelle dein Konto und nutze Terminkalender, Lernplan und Dokumente.</p>

      <div class="form-error" id="formError"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Vor- und Nachname" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">E-Mail</label>
          <input type="email" id="email" name="email" placeholder="dein@beispiel.de" autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Passwort</label>
          <input type="password" id="password" name="password" placeholder="Mindestens 6 Zeichen" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="password2">Passwort wiederholen</label>
          <input type="password" id="password2" name="password2" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary">Konto erstellen</button>
      </form>

      <p class="auth-alt">Schon ein Konto? <a href="anmelden.html">Jetzt anmelden</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> Studiumm</span>
      <nav>
        <a href="kontakt.html">Kontakt</a>
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
